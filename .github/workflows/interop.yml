name: Interop

# The Kotlin engine (as on the phone) and ClipDrop.Core (as on the PC) talk to each other over TLS
# on localhost. Runs on Windows so the host side uses SChannel, as it does in the real app.

on:
  push:
    branches: [main]
    paths:
      - "android/protocol/**"
      - "android/engine/**"
      - "android/gradle/**"
      - "android/*.kts"
      - "windows/ClipDrop.Core/**"
      - "windows/*.props"
      - "interop/**"
      - "docs/test-vectors/**"
      - ".github/workflows/interop.yml"
  pull_request:
    paths:
      - "android/protocol/**"
      - "android/engine/**"
      - "android/gradle/**"
      - "android/*.kts"
      - "windows/ClipDrop.Core/**"
      - "windows/*.props"
      - "interop/**"
      - "docs/test-vectors/**"
      - ".github/workflows/interop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  interop:
    name: Pair and ping (Kotlin client, .NET host)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Run the interop test
        shell: bash
        run: interop/run.sh
